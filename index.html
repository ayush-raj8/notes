<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <meta
      name="description"
      content="Notes for software-engineering study. Computer Networks is the first subject."
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var key = "notes:redirect";
        var redirect = sessionStorage.getItem(key);
        if (!redirect) return;
        sessionStorage.removeItem(key);
        if (redirect !== location.href) history.replaceState(null, "", redirect);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
