name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          GITHUB_PAGES: "true"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven verify (java-book)
        working-directory: java-book/code
        run: mvn -B -q verify

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.43"
      - name: Build java-book (static HTML only)
        working-directory: java-book
        run: mdbook build

      - name: Assemble site
        run: |
          mkdir -p site
          # CN Vite app stays at site root so /notes/ URL is unchanged.
          cp -R dist/. site/
          # Java mdBook HTML at /notes/java/ (Pages hosts static files only).
          mkdir -p site/java
          cp -R java-book/book/. site/java/
          # Additive series landing (does not replace CN index).
          mkdir -p site/library
          cp java-book/landing/index.html site/library/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
