[book]
title = "Java OOP, SOLID, and LLD"
description = "Compiled Java examples for object-oriented programming, SOLID, design patterns, and low-level design."
src = "src"
language = "en"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/ayush-raj8/notes"
site-url = "/notes/java/"
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
mathjax-support = false
additional-css = ["theme/custom.css"]
additional-js = ["theme/custom.js"]

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = false
copyable = true
copy-js = true
line-numbers = false

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
